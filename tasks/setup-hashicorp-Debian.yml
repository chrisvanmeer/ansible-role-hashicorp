---
- name: "Ensure prerequisite packages are present."
  ansible.builtin.apt:
    name:
      - gnupg
      - ca-certificates
      - python3-debian
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: "Ensure the APT keyring directory exists."
  ansible.builtin.file:
    path: "{{ hashicorp_apt_keyring_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: "Ensure the HashiCorp GPG key is downloaded."
  ansible.builtin.get_url:
    url: "{{ hashicorp_gpg_key_url }}"
    dest: /tmp/hashicorp-archive-keyring.asc
    mode: "0644"
  register: hashicorp_gpg_download

- name: "Ensure the HashiCorp GPG key is de-armored into the keyring."  # noqa: no-handler
  ansible.builtin.command:
    cmd: >-
      gpg --batch --yes --dearmor
      --output {{ hashicorp_apt_keyring_path }}
      /tmp/hashicorp-archive-keyring.asc
  when: hashicorp_gpg_download is changed
  changed_when: true

- name: "Ensure the temporary GPG key file is removed."
  ansible.builtin.file:
    path: /tmp/hashicorp-archive-keyring.asc
    state: absent

- name: "Ensure the HashiCorp APT repository is present."
  ansible.builtin.deb822_repository:
    name: hashicorp
    types:
      - deb
    uris:
      - https://apt.releases.hashicorp.com
    suites:
      - "{{ ansible_facts.distribution_release }}"
    components:
      - main
    architectures:
      - "{{ 'amd64' if ansible_facts.architecture == 'x86_64' else ansible_facts.architecture }}"
    signed_by: "{{ hashicorp_apt_keyring_path }}"
    state: present
    enabled: true

- name: "Update APT cache after adding HashiCorp repository."
  ansible.builtin.apt:
    update_cache: true

- name: "Ensure requested HashiCorp packages are present."
  ansible.builtin.apt:
    name: "{{ item.name }}{{ ('=' ~ item.version ~ '*') if item.version | default('latest') != 'latest' else '' }}"
    state: present
  loop: "{{ hashicorp_products }}"
  loop_control:
    label: "{{ item.name }}{{ (' (' ~ item.version ~ ')') if item.version is defined else '' }}"
